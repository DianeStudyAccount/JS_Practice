<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OOP practice</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <form id="plantForm">
      <h2>Add a new plant and save the info in the table below</h2>

      <input type="text" id="name" placeholder="Name" required />
      <input type="text" id="description" placeholder="Description" required />
      <input type="text" id="species" placeholder="Species" required />
      <input type="number" id="age" placeholder="Age" required />

      <select id="plantType" required>
        <option value="">Choose class</option>
        <option value="fern">Fern</option>
        <option value="firtree">Fir tree</option>
      </select>

      <input type="text" id="dangerClass" placeholder="Danger class" />
      <input type="text" id="area" placeholder="Growing area" />
      <input type="text" id="usage" placeholder="Usage" />

      <button type="submit">Save</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Species</th>
          <th>Age</th>
          <th>Class</th>
          <th>Danger</th>
          <th>Area</th>
          <th>Usage</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </body>
</html>
